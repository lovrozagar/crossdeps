name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run test:consumers
        env:
          CROSSDEPS_REAL_INSTALL: "1"
      - run: bun run typecheck
        if: runner.os == 'Linux'
      - run: bun run typecheck:consumers
        if: runner.os == 'Linux'

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e:docker

  catalog-install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Allow Chocolatey confirmation
        if: runner.os == 'Windows'
        run: choco feature enable -n allowGlobalConfirmation
      - name: Install the monorepo catalog
        run: bun e2e/catalog-install.ts
        env:
          CROSSDEPS_INSTALL_TIMEOUT_MS: "180000"
